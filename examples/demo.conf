# Demo stack: db -> api -> web, plus a flaky batch job.
[db]
command=sleep 100000
restart=always
ready_delay_ms=500

[api]
command=sh -c "while true; do echo api alive; sleep 2; done"
depends=db
restart=always
backoff_ms=300

[web]
command=sleep 100001
depends=api
restart=on-failure

[flaky-job]
command=sh -c "sleep 1; exit 3"
restart=on-failure
max_restarts=3
backoff_ms=200
